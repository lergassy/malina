<style>
:root{
  --ink:#08090b; --ink-2:#0d0e11;
  --glass:rgba(255,255,255,.045); --glass-strong:rgba(255,255,255,.07);
  --line:rgba(255,255,255,.09);
  --text:#f5f1e7; --muted:#97938a;
  --gold:#d2a45c; --sand:#ecd5a4;
  --grad:linear-gradient(105deg,var(--sand),var(--gold) 60%,#a97c3c);
  --ease:cubic-bezier(.19,1,.22,1);
  --container:1080px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{background:var(--ink);color:var(--text);font-family:'Inter',-apple-system,system-ui,sans-serif;font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.container{width:min(var(--container),calc(100% - 48px));margin-inline:auto}
::selection{background:var(--gold);color:var(--ink)}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--gold)}
.gold-text{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}

/* header (общий с главной) */
.site-header{position:fixed;inset:0 0 auto 0;z-index:80;background:rgba(8,9,11,.72);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}
.header-inner{display:flex;align-items:center;justify-content:space-between;height:76px}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:19px;letter-spacing:-.02em}
.logo-mark{width:30px;height:30px;border-radius:9px;background:var(--grad);display:grid;place-items:center;color:var(--ink);font-size:15px;font-weight:700}
.logo-badge{flex:0 0 auto;display:block}
.logo-img{width:44px;height:44px;flex:0 0 auto;background:url("logo-surf.png") no-repeat center/contain}
.logo .lw b{color:var(--text);font-weight:700}
.logo .lw i{font-style:normal;font-weight:700;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}

.nav{display:flex;gap:34px;font-size:14.5px;font-weight:500}
.nav>a,.nav .nav-drop>button{color:var(--muted);transition:color .3s;display:flex;align-items:center;gap:6px}
.nav>a:hover,.nav .nav-drop:hover>button{color:var(--text)}
.nav-drop{position:relative}
.nav-drop svg{transition:transform .3s}
.nav-drop:hover svg{transform:rotate(180deg)}
.drop-menu{
  position:absolute;top:calc(100% + 14px);left:50%;transform:translateX(-50%) translateY(8px);
  min-width:250px;padding:10px;border-radius:16px;border:1px solid var(--line);
  background:rgba(13,14,17,.96);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  box-shadow:0 30px 70px -20px rgba(0,0,0,.8);
  opacity:0;visibility:hidden;transition:.35s var(--ease);
}
.nav-drop:hover .drop-menu,.nav-drop:focus-within .drop-menu{opacity:1;visibility:visible;transform:translateX(-50%) translateY(0)}
.drop-menu a.sub2{padding-left:26px;font-size:13.5px;opacity:.82}
.drop-menu a{display:block;padding:11px 14px;border-radius:10px;font-size:14px;color:var(--muted);transition:.25s}
.drop-menu a:hover{background:var(--glass-strong);color:var(--text)}
.drop-menu a.current{color:var(--sand)}
.drop-menu .drop-all{margin-top:6px;border-top:1px solid var(--line);padding-top:12px;color:var(--gold);font-weight:600}
.header-right{display:flex;align-items:center;gap:18px}
.lang-switch{display:flex;border:1px solid var(--line);border-radius:99px;overflow:hidden;font-size:12.5px;font-weight:600;letter-spacing:.06em}
.lang-switch button{padding:7px 14px;color:var(--muted);transition:.3s}
.lang-switch button.active{background:var(--glass-strong);color:var(--text)}
.burger{display:none;flex-direction:column;gap:5px;padding:8px}
.burger span{width:22px;height:2px;background:var(--text);border-radius:2px}
.mobile-nav{position:fixed;top:0;left:0;right:0;bottom:0;z-index:75;background:#0a0b0e;display:none;flex-direction:column;justify-content:flex-start;gap:4px;padding:92px 32px 36px;overflow-y:auto}
.mobile-nav.open{display:flex}
.mobile-nav a{font-size:22px;font-weight:700;letter-spacing:-.02em;padding:5px 0}
.mobile-nav .sub{font-size:15px;font-weight:500;color:var(--muted);padding:4px 0 4px 18px}

/* page hero */
.page-hero{padding:150px 0 56px;background:
  radial-gradient(90% 70% at 80% 0%,rgba(210,164,92,.14),transparent 60%),var(--ink)}
.crumbs{display:flex;gap:8px;font-size:13px;color:var(--muted);margin-bottom:26px;flex-wrap:wrap}
.crumbs a:hover{color:var(--text)}
h1{font-weight:700;letter-spacing:-.03em;line-height:1.06;font-size:clamp(34px,5vw,58px);max-width:820px}
.hero-chips{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:44px}
.chip{padding:22px 24px;border:1px solid var(--line);border-radius:18px;background:var(--glass)}
.chip b{display:block;font-size:16.5px;margin-bottom:6px}
.chip span{font-size:14px;color:var(--muted)}
.chip i{font-style:normal;display:block;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin-bottom:12px}

/* content */
.page{padding:26px 0 90px}
.section-block{margin-top:64px}
h2{font-weight:700;letter-spacing:-.025em;line-height:1.12;font-size:clamp(25px,3vw,36px);margin-bottom:22px}
.page p{color:rgba(245,241,231,.85);max-width:760px;margin-bottom:14px}
.page p.dim{color:var(--muted);font-size:14.5px}
.tick-list{list-style:none;max-width:760px}
.tick-list li{position:relative;padding:10px 0 10px 34px;color:rgba(245,241,231,.88);border-bottom:1px solid rgba(255,255,255,.05)}
.tick-list li::before{content:"";position:absolute;left:0;top:16px;width:18px;height:18px;border-radius:50%;
  background:rgba(210,164,92,.14) url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="%23d2a45c" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 13 4 4L19 7"/></svg>') center/10px no-repeat}
.note{margin-top:18px;padding:16px 20px;border-left:2px solid var(--gold);background:var(--glass);border-radius:0 14px 14px 0;font-size:14.5px;color:rgba(245,241,231,.85);max-width:760px}
.note b{color:var(--sand)}

/* pricing */
.price-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;max-width:820px}
.price-card{padding:32px 30px;border:1px solid var(--line);border-radius:22px;background:linear-gradient(215deg,var(--glass-strong),rgba(255,255,255,.02));display:flex;flex-direction:column}
.price-card.featured{border-color:rgba(210,164,92,.45)}
.price-card .p-name{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin-bottom:14px}
.price-card .p-sum{font-size:clamp(26px,2.6vw,34px);font-weight:700;letter-spacing:-.02em}
.price-card .p-term{font-size:13.5px;color:var(--muted);margin:6px 0 20px}
.price-card ul{list-style:none;font-size:14px;color:rgba(245,241,231,.85);margin-bottom:8px}
.price-card ul li{padding:6px 0 6px 24px;position:relative}
.price-card ul li::before{content:"—";position:absolute;left:0;color:var(--gold)}

/* steps */
.steps{counter-reset:step;max-width:760px}
.step{position:relative;padding:22px 0 22px 64px;border-bottom:1px solid rgba(255,255,255,.05)}
.step::before{counter-increment:step;content:counter(step);position:absolute;left:0;top:20px;width:40px;height:40px;border-radius:12px;
  display:grid;place-items:center;font-weight:700;color:var(--ink);background:var(--grad);font-size:16px}
.step b{display:block;margin-bottom:6px;font-size:16.5px}
.step p{font-size:14.5px;color:var(--muted);margin:0;max-width:640px}

/* accordions — «выпадающие списки» как на референсе */
.acc{max-width:820px;border-top:1px solid var(--line)}
.acc-item{border-bottom:1px solid var(--line)}
.acc-item summary{
  list-style:none;display:flex;justify-content:space-between;align-items:center;gap:20px;
  padding:20px 4px;cursor:pointer;font-weight:600;font-size:16.5px;transition:color .3s;
}
.acc-item summary::-webkit-details-marker{display:none}
.acc-item summary:hover{color:var(--sand)}
.acc-item summary .acc-ico{flex:0 0 auto;width:28px;height:28px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;color:var(--gold);transition:transform .4s var(--ease),background .3s}
.acc-item[open] summary .acc-ico{transform:rotate(45deg);background:rgba(210,164,92,.14)}
.acc-body{padding:2px 4px 24px;color:rgba(245,241,231,.82);font-size:15px;max-width:740px}
.acc-body p{margin-bottom:10px}
.acc-body ul{list-style:none;margin:8px 0}
.acc-body ul li{padding:5px 0 5px 22px;position:relative}
.acc-body ul li::before{content:"—";position:absolute;left:0;color:var(--gold)}

/* other visas */
.other-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.other-card{padding:26px 24px;border:1px solid var(--line);border-radius:18px;background:var(--glass);transition:.4s var(--ease);display:flex;flex-direction:column;gap:10px}
.other-card:hover{border-color:rgba(210,164,92,.4);transform:translateY(-4px)}
.other-card b{font-size:16.5px}
.other-card span{font-size:13.5px;color:var(--muted);line-height:1.55}
.other-card .oc-tag{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}

/* CTA */
.cta{margin-top:80px;padding:52px 46px;border-radius:26px;border:1px solid rgba(210,164,92,.3);
  background:radial-gradient(120% 130% at 85% 0%,rgba(210,164,92,.16),transparent 55%),var(--ink-2);
  display:flex;justify-content:space-between;align-items:center;gap:30px;flex-wrap:wrap}
.cta h2{margin:0;max-width:520px}
.btn{display:inline-flex;align-items:center;gap:10px;padding:16px 30px;border-radius:99px;font-size:15px;font-weight:600;transition:.45s var(--ease)}
.btn-gold{background:var(--grad);color:#161006}
.btn-gold:hover{transform:translateY(-2px);box-shadow:0 14px 44px -12px rgba(210,164,92,.55)}

/* footer + chat (общие с главной) */
.site-footer{border-top:1px solid var(--line);padding:70px 0 40px;background:var(--ink-2)}
.footer-grid{display:grid;grid-template-columns:1.4fr repeat(3,1fr);gap:44px;margin-bottom:56px}
.footer-brand p{margin-top:16px;font-size:14.5px;color:var(--muted);max-width:300px}
.footer-col h4{font-size:12px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);margin-bottom:18px}
.footer-col a{display:block;padding:7px 0;font-size:14.5px;color:var(--muted);transition:color .3s}
.footer-col a:hover{color:var(--text)}
.footer-bottom{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;padding-top:28px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.chat-widget{position:fixed;right:22px;bottom:26px;z-index:90;display:flex;flex-direction:column;align-items:flex-end;gap:12px}
.chat-links{display:flex;flex-direction:column;gap:10px;opacity:0;transform:translateY(14px);pointer-events:none;transition:.45s var(--ease)}
.chat-widget.open .chat-links{opacity:1;transform:none;pointer-events:auto}
.chat-ico{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;color:#fff;box-shadow:0 12px 34px -10px rgba(0,0,0,.6);transition:transform .35s var(--ease)}
.chat-ico:hover{transform:scale(1.08)}
.chat-ico.tg{background:#2aabee}.chat-ico.wa{background:#25d366}
.chat-ico.em{background:linear-gradient(135deg,#d2a45c,#a97c3c)}
.chat-toggle{display:flex;align-items:center;gap:10px;padding:15px 22px;border-radius:99px;background:var(--grad);color:#161006;font-weight:600;font-size:14.5px;box-shadow:0 16px 44px -12px rgba(210,164,92,.6);transition:transform .35s var(--ease)}
.chat-toggle:hover{transform:translateY(-2px)}

/* язык: RU-контент показан по умолчанию, EN включается классом на body */
main.en{display:none}
body.lang-en main.ru{display:none}
body.lang-en main.en{display:block}

@media(max-width:1000px){
  .nav{display:none}.burger{display:flex}
  .hero-chips,.price-grid,.other-grid{grid-template-columns:1fr}
  .footer-grid{grid-template-columns:1fr 1fr}
  .cta{padding:36px 26px}
}
@media(prefers-reduced-motion:reduce){*{transition-duration:.001s!important}}

@media(max-width:1000px){
.hero-chips{gap:10px}
.chip{padding:13px 16px}
.chip i{font-size:10.5px}
.chip b{font-size:16.5px}
.chip span{display:none}
}
.skip-link{position:absolute;left:-9999px;top:0;background:var(--gold);color:#0e0e13;padding:10px 18px;z-index:1200;font-weight:600;border-radius:0 0 10px 0}.skip-link:focus{left:0}

/* tables */
.tbl-wrap{margin-top:22px;overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:16px;background:var(--glass)}
.tbl{width:100%;border-collapse:collapse;font-size:14.5px;min-width:560px}
.tbl caption{text-align:left;padding:16px 20px 0;color:var(--muted);font-size:13.5px;caption-side:top}
.tbl th,.tbl td{padding:13px 18px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.5}
.tbl thead th{background:rgba(255,255,255,.05);color:var(--sand);font-weight:600;font-size:13px;letter-spacing:.02em;text-transform:uppercase;white-space:nowrap}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl tbody tr:hover{background:rgba(255,255,255,.025)}
.tbl td:first-child{color:var(--text);font-weight:500}
.tbl .num{white-space:nowrap;font-variant-numeric:tabular-nums}
.tbl .yes{color:#7fc99a}
.tbl .no{color:#c98b8b}
.tbl .mid{color:var(--muted)}
.tbl tr.hl td{background:linear-gradient(90deg,rgba(210,164,92,.11),rgba(210,164,92,.02));border-bottom-color:rgba(210,164,92,.22)}
.tbl tr.hl td:first-child{color:var(--sand);font-weight:600;box-shadow:inset 2px 0 0 var(--gold)}
.tbl-note{margin-top:10px;color:var(--muted);font-size:13px;line-height:1.55}
@media(max-width:720px){.tbl{font-size:13.5px}.tbl th,.tbl td{padding:11px 14px}}
</style>

<main style="min-height:100vh;display:grid;place-items:center;text-align:center;padding:40px 24px">
  <div>
