    <body>Verification: cac7f5155e0c6af0<script>
/* Защита от пустой страницы: если версии на языке посетителя нет, показываем ту, что есть. */
(function(){
  function guard(){
    var mains = document.querySelectorAll("main");
    if (!mains.length) return;
    var visible = false;
    for (var i=0;i<mains.length;i++){ if (getComputedStyle(mains[i]).display !== "none"){ visible = true; break; } }
    if (!visible) mains[0].style.setProperty("display","block","important");
  }
  guard();
  document.querySelectorAll(".lang-switch button").forEach(function(b){ b.addEventListener("click", function(){ setTimeout(guard, 0); }); });
})();
</script>
